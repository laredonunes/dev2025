<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Quest - A Tragédia Ambiental</title>
    <style>
        :root {
            --primary: #1A5D1A; --primary-hover: #144514; --secondary: #F5F5F5;
            --white: #FFFFFF; --text-primary: #212121; --text-secondary: #555555;
            --border: #E0E0E0; --danger: #D32F2F;
            --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px;
            --font-primary: 'Segoe UI', Roboto, sans-serif; --font-size-sm: 14px;
            --font-size-base: 16px; --font-size-lg: 20px; --font-size-xl: 28px;
            --line-height-base: 1.6; --radius-md: 8px; --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
            --transition-base: 0.3s ease;
        }
        
        body.light-theme {
            --bg-main: #F5F5F5; --bg-panel: rgba(255, 255, 255, 0.25);
            --bg-panel-hover: rgba(255, 255, 255, 0.4); --bg-menu: rgba(255, 255, 255, 0.7);
            --text-main: #212121; --text-panel: #FFFFFF; --text-menu: #212121;
            --border-color: rgba(255, 255, 255, 0.3); --shadow-text: 1px 1px 3px rgba(0,0,0,0.5);
        }

        body.dark-theme {
            --primary: #4CAF50; --primary-hover: #388E3C; --bg-main: #121212;
            --bg-panel: rgba(18, 18, 18, 0.6); --bg-panel-hover: rgba(18, 18, 18, 0.8);
            --bg-menu: rgba(30, 30, 30, 0.8); --text-main: #FFFFFF; --text-panel: #FFFFFF;
            --text-menu: #FFFFFF; --border-color: rgba(255, 255, 255, 0.2); --shadow-text: none;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-primary); font-size: var(--font-size-base);
            line-height: var(--line-height-base); color: var(--text-main);
            background-color: var(--bg-main); overflow: hidden;
            transition: background-color var(--transition-base), color var(--transition-base);
        }
        
        .game-viewport { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        .hero-background { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .game-content-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.3); z-index: 2; display: flex; justify-content: center; align-items: center; padding: var(--space-lg); }

        .game-title {
            position: absolute;
            top: var(--space-lg);
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            width: 300px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }

        .menu-toggle { position: absolute; top: var(--space-lg); left: var(--space-lg); width: 50px; height: 50px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; cursor: pointer; z-index: 1002; box-shadow: var(--shadow-md); backdrop-filter: blur(8px); }
        .menu-toggle .bar { width: 24px; height: 3px; background: var(--text-panel); border-radius: 2px; transition: all var(--transition-base); }
        .menu-toggle.open .bar { background: var(--text-menu); }
        .menu-toggle.open .bar:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .menu-toggle.open .bar:nth-child(2) { opacity: 0; }
        .menu-toggle.open .bar:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        .floating-menu {
            position: fixed; top: 0; left: -350px; width: 350px; height: 100vh;
            background: var(--bg-menu); backdrop-filter: blur(15px);
            padding: var(--space-lg);
            padding-top: 80px;
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; z-index: 1001;
            transition: left var(--transition-base); box-shadow: var(--shadow-md);
            color: var(--text-menu);
        }
        .floating-menu.open { left: 0; }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; opacity: 0; visibility: hidden; transition: opacity var(--transition-base), visibility var(--transition-base); }
        .menu-overlay.open { opacity: 1; visibility: visible; }
        
        .sidebar-section { background: rgba(0,0,0,0.05); padding: var(--space-md); border-radius: var(--radius-md); }
        .sidebar-title { font-size: var(--font-size-lg); font-weight: 600; color: var(--primary); margin-bottom: var(--space-md); }
        #context-display, #actions-log { font-size: var(--font-size-sm); max-height: 200px; overflow-y: auto; }
        #actions-log ul { list-style-position: inside; padding-left: var(--space-sm); }
        
        .theme-switcher-btn { margin-top: auto; background: none; border: 1px solid var(--text-menu); color: var(--text-menu); }

        .interaction-panel { max-width: 900px; width: 90%; background: var(--bg-panel); padding: var(--space-xl); border-radius: var(--radius-md); box-shadow: var(--shadow-md); border: 1px solid var(--border-color); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .narrative-box { padding: 0; box-shadow: none; margin-bottom: var(--space-xl); background: transparent; }
        #narrative-text, #start-screen p { color: var(--text-panel); text-shadow: var(--shadow-text); }
        #start-screen h1 { display: none; }
        
        .response-area textarea { width: 100%; min-height: 100px; padding: var(--space-md); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-family: var(--font-primary); font-size: var(--font-size-base); resize: vertical; background: rgba(0, 0, 0, 0.2); color: var(--text-panel); }
        .response-area textarea::placeholder { color: rgba(255, 255, 255, 0.7); }
        
        .choices-area { display: grid; grid-template-columns: 1fr; gap: var(--space-md); }
        .btn { padding: 12px 24px; border: none; border-radius: var(--radius-md); font-size: var(--font-size-base); font-weight: 600; cursor: pointer; transition: all var(--transition-base); text-align: left; }
        .btn-primary { background: var(--primary); color: var(--white); text-align: center; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-choice { background: var(--bg-panel); color: var(--text-panel); border: 1px solid var(--border-color); backdrop-filter: blur(5px); }
        .btn-choice:hover { background: var(--bg-panel-hover); border-color: var(--primary); }
        
        .biome-selection { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); margin-bottom: var(--space-xl); }
        .biome-card { background: rgba(0, 0, 0, 0.2); border: 2px solid var(--border-color); border-radius: var(--radius-md); padding: var(--space-lg); text-align: center; cursor: pointer; transition: all var(--transition-base); }
        .biome-card:hover { background: rgba(0, 0, 0, 0.4); }
        .biome-card.selected { border-color: var(--primary); background: rgba(26, 93, 26, 0.5); }
        .biome-icon img { height: 60px; width: auto; margin-bottom: var(--space-sm); }
        .biome-name { color: var(--white); font-weight: 600; margin-top: var(--space-sm); }

        .spinner { border: 4px solid rgba(255, 255, 255, 0.2); width: 36px; height: 36px; border-radius: 50%; border-left-color: var(--white); animation: spin 1s ease infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ==========================================
           RESPONSIVIDADE PARA DISPOSITIVOS MÓVEIS
           ========================================== */
        @media (max-width: 768px) {
            .game-title {
                width: 200px;
                top: var(--space-md);
            }
            .interaction-panel {
                width: 95%;
                padding: var(--space-lg);
            }
            .biome-selection {
                grid-template-columns: 1fr; /* Empilha os biomas */
            }
            .floating-menu {
                width: 280px; /* Menu um pouco mais estreito */
                left: -280px;
            }
            #start-screen p {
                font-size: var(--font-size-sm);
            }
        }
    </style>
</head>
<body class="light-theme">

    <div class="game-viewport">
        <img src="/images/Design sem nome.png" alt="Cenário de fundo do Eco Quest" class="hero-background">
        <img src="/images/titulo.png" alt="Eco Quest" class="game-title">
        <div class="game-content-overlay">
            <div id="start-screen" class="interaction-panel">
                <h1>Eco Quest</h1>
                <p>Escolha o bioma para iniciar sua missão de recuperação ambiental.</p>
                <div class="biome-selection">
                    <div class="biome-card" data-biome="floresta"><div class="biome-icon"><img src="/images/icone/2.png" alt="Ícone de Floresta"></div><div class="biome-name">Floresta</div></div>
                    <div class="biome-card" data-biome="mangue"><div class="biome-icon"><img src="/images/icone/3.png" alt="Ícone de Mangue"></div><div class="biome-name">Mangue</div></div>
                    <div class="biome-card" data-biome="mar"><div class="biome-icon"><img src="/images/icone/1.png" alt="Ícone de Mar"></div><div class="biome-name">Mar</div></div>
                </div>
                <button id="start-game-btn" class="btn btn-primary">Iniciar Jogo</button>
            </div>
            <div id="game-screen" class="interaction-panel" style="display: none;">
                <div class="narrative-box"><div id="narrative-text"></div><div class="spinner" id="loading-spinner"></div></div>
                <div id="narrative-response-area" class="response-area" style="display: none;"><textarea id="user-response-text" placeholder="Descreva sua ação..."></textarea><button id="send-narrative-btn" class="btn btn-primary" style="margin-top: var(--space-md); width: 100%;">Responder</button></div>
                <div id="choices-response-area" class="choices-area" style="display: none;"></div>
            </div>
        </div>
        <div class="menu-toggle" id="menu-toggle"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        <div class="menu-overlay" id="menu-overlay"></div>
        <aside class="floating-menu" id="floating-menu">
            <div class="sidebar-section"><h2 class="sidebar-title">🌍 Contexto Atual</h2><div id="context-display"><p>Aguardando início do jogo...</p></div></div>
            <div class="sidebar-section"><h2 class="sidebar-title">📝 Log de Ações</h2><div id="actions-log"><ul></ul></div></div>
            <div class="sidebar-section"><h2 class="sidebar-title">🏆 Progresso</h2><div id="progress-display"><p>0%</p></div></div>
            <button class="btn theme-switcher-btn" id="theme-switcher">☀️/🌙 Alterar Tema</button>
        </aside>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.getElementById('menu-toggle');
            const floatingMenu = document.getElementById('floating-menu');
            const menuOverlay = document.getElementById('menu-overlay');
            const themeSwitcher = document.getElementById('theme-switcher');
            const body = document.body;

            function toggleMenu() {
                menuToggle.classList.toggle('open');
                floatingMenu.classList.toggle('open');
                menuOverlay.classList.toggle('open');
            }

            function setTheme(theme) {
                body.classList.remove('light-theme', 'dark-theme');
                body.classList.add(theme + '-theme');
                localStorage.setItem('theme', theme);
            }

            menuToggle.addEventListener('click', toggleMenu);
            menuOverlay.addEventListener('click', toggleMenu);
            
            themeSwitcher.addEventListener('click', () => {
                const currentTheme = localStorage.getItem('theme') || 'light';
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                setTheme(newTheme);
            });

            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);

            const biomeCards = document.querySelectorAll('.biome-card');
            let selectedBiome = null;
            biomeCards.forEach(card => {
                card.addEventListener('click', () => {
                    biomeCards.forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedBiome = card.dataset.biome;
                });
            });

            const startGameBtn = document.getElementById('start-game-btn');
            startGameBtn.addEventListener('click', () => {
                if (!selectedBiome) {
                    alert('Por favor, escolha um bioma para iniciar.');
                    return;
                }
                const disasterMap = {
                    floresta: "Um incêndio de grandes proporções avança sobre uma floresta de mata atlântica, ameaçando a fauna e a flora locais.",
                    mangue: "Um derramamento de óleo de um navio cargueiro atingiu uma área de manguezal, contaminando a água e sufocando as raízes.",
                    mar: "Uma grande mancha de lixo plástico, conhecida como 'ilha de plástico', está se aproximando de um santuário de corais."
                };
                const initialDisaster = disasterMap[selectedBiome];
                console.log("Iniciando jogo com o desastre:", initialDisaster);
            });
        });
    </script>

</body>
</html>
