version: '3.8'

services:
  redis:
    image: "redis:7-alpine"
    container_name: redis_celery_broker
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    restart: always

  web:
    build: .
    container_name: flask_web_app
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    env_file:
      - .env
    command: >
      sh -c "flask init-app && flask run --host=0.0.0.0"
    depends_on:
      - redis

  worker:
    build: .
    container_name: celery_worker
    volumes:
      - .:/app
    env_file:
      - .env
    command: celery -A app.celery worker --loglevel=info
    depends_on:
      - redis
      - web

volumes:
  redis_data: